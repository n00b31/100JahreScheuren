name: Update dashboard

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build dashboard from Microsoft Lists
        shell: pwsh
        env:
          LIST_PASSWORD: ${{ secrets.LIST_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LIST_PASSWORD)) {
            throw "Repository secret LIST_PASSWORD is missing."
          }

          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $shareUrl = "https://lists.live.com/:l:/g/personal/beae2099d041d6fd/JAASbOY0RYroRZAOdGcJFyX9AUZ7TlL_1aOuWmFlzZk8weE?e=KJ9K0T"
          $postUrl = "https://lists.live.com/personal/beae2099d041d6fd/_layouts/15/guestaccess.aspx?e=KJ9K0T&share=JAASbOY0RYroRZAOdGcJFyX9AUZ7TlL_1aOuWmFlzZk8weE"
          $apiUrl = "https://lists.live.com/personal/beae2099d041d6fd/_api/web/lists(guid'34e66c12-8a45-45e8-900e-7467091725fd')/items?`$top=5000"

          $initial = Invoke-WebRequest -Uri $shareUrl -SessionVariable session -UseBasicParsing
          function Get-FieldValue([string]$name) {
            $pattern = 'name="' + [regex]::Escape($name) + '"[^>]*value="([^"]*)"'
            $match = [regex]::Match($initial.Content, $pattern)
            if (-not $match.Success) { throw "Required SharePoint form field '$name' was not found." }
            return [System.Net.WebUtility]::HtmlDecode($match.Groups[1].Value)
          }
          function Get-Value($item, [string]$key) {
            if ($item.ContainsKey($key) -and $null -ne $item[$key]) { return $item[$key] }
            return $null
          }

          $body = @{
            "__EVENTTARGET" = "btnSubmitPassword"
            "__EVENTARGUMENT" = ""
            "SideBySideToken" = Get-FieldValue "SideBySideToken"
            "__VIEWSTATE" = Get-FieldValue "__VIEWSTATE"
            "__VIEWSTATEGENERATOR" = Get-FieldValue "__VIEWSTATEGENERATOR"
            "__VIEWSTATEENCRYPTED" = Get-FieldValue "__VIEWSTATEENCRYPTED"
            "__EVENTVALIDATION" = Get-FieldValue "__EVENTVALIDATION"
            "txtPassword" = $env:LIST_PASSWORD
          }

          Invoke-WebRequest -Uri $postUrl -Method Post -Body $body -WebSession $session -UseBasicParsing | Out-Null
          $apiResponse = Invoke-WebRequest -Uri $apiUrl -WebSession $session -UseBasicParsing -Headers @{ Accept = "application/json;odata=nometadata" }
          if ($apiResponse.Content -notmatch '^\s*\{') {
            throw "List API did not return JSON. Response starts with: $($apiResponse.Content.Substring(0, [Math]::Min(120, $apiResponse.Content.Length)))"
          }
          $response = $apiResponse.Content | ConvertFrom-Json -AsHashtable
          $values = @($response['value'])
          if ($null -eq $response['value'] -or $values.Count -lt 10) {
            throw "List API returned $($values.Count) item(s); refusing to update dashboard."
          }

          $items = @($values | ForEach-Object {
            $id = Get-Value $_ "ID"
            $title = [string](Get-Value $_ "Title")
            if ($null -eq $id -or [string]::IsNullOrWhiteSpace($title)) {
              throw "Invalid list item encountered; refusing to update dashboard."
            }
            [pscustomobject]@{
              id = $id
              firma = $title.Trim()
              antrag = if (Get-Value $_ "DonationType") { Get-Value $_ "DonationType" } else { "" }
              grafik = if (Get-Value $_ "EstimatedPrice") { Get-Value $_ "EstimatedPrice" } else { "" }
              groesse = if (Get-Value $_ "Gr_x00f6__x00df_e") { Get-Value $_ "Gr_x00f6__x00df_e" } else { "" }
              bezahlt = [bool](Get-Value $_ "Bezhalt")
              rechnung = [bool](Get-Value $_ "Rechnunggestellt")
              umsatzneutral = [bool](Get-Value $_ "Umsatzneutral")
              kommentar = if (Get-Value $_ "Kommentar") { Get-Value $_ "Kommentar" } else { "" }
            }
          })

          $dataJson = (ConvertTo-Json -InputObject @($items) -Depth 8 -Compress) -replace "</", "<\/"
          if ($dataJson -notmatch '^\[') { throw "Serialized dashboard data is not a JSON array; refusing to update dashboard." }
          $generatedAt = (Get-Date).ToString("dd.MM.yyyy HH:mm")

          $templatePath = "index.html"
          $html = Get-Content -LiteralPath $templatePath -Raw
          $html = [regex]::Replace($html, '(<span id="updatedAt">).*?(</span>)', '$1' + $generatedAt + '$2')
          $html = [regex]::Replace($html, 'const ads=.*?;\s*const prices=', 'const ads=' + $dataJson + ';' + [Environment]::NewLine + 'const prices=', 'Singleline')
          if ($html -match 'const ads=\{') { throw "Dashboard data replacement failed; refusing to write index.html." }
          Set-Content -LiteralPath $templatePath -Value $html -Encoding UTF8

      - name: Commit updated dashboard
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if (git diff --cached --quiet) {
            Write-Host "No dashboard changes to commit."
          } else {
            git commit -m "Update dashboard data"
            git push
          }


